name: Export Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/ExportWorkspace.jsx'
      - 'electron/exportEngine.cjs'
      - 'electron/main.cjs'
      - 'electron/preload.cjs'
      - 'scripts/verify-export-contract.mjs'
      - '.github/workflows/export-contract.yml'
  pull_request:
    paths:
      - 'src/ExportWorkspace.jsx'
      - 'electron/exportEngine.cjs'
      - 'electron/main.cjs'
      - 'electron/preload.cjs'
      - 'scripts/verify-export-contract.mjs'
      - '.github/workflows/export-contract.yml'

jobs:
  verify-export-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify export wiring
        run: node scripts/verify-export-contract.mjs
