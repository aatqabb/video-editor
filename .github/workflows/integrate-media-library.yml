name: Integrate Real Media Library

on:
  push:
    paths:
      - 'scripts/integrate-media-library.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate real media library
        run: node scripts/integrate-media-library.mjs src/App.jsx
      - name: Commit generated integration
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed"
            exit 0
          fi
          git config user.name "aatqabb"
          git config user.email "aatqagillani@gmail.com"
          git add src/App.jsx
          git commit -m "Integrate local media thumbnails and waveforms"
          git push
