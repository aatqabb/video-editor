name: Final Regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/final-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated final regression gate
        run: npm run verify:final
