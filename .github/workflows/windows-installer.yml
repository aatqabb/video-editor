name: Windows Installer

on:
  pull_request:
    paths:
      - 'package.json'
      - 'electron/**'
      - 'src/**'
      - 'scripts/prepare-windows-ffmpeg.cjs'
      - 'scripts/verify-offline-editing.cjs'
      - 'scripts/verify-windows-native-picker.mjs'
      - 'scripts/verify-gpu-runtime.mjs'
      - 'scripts/vite-*.js'
      - 'vite.config.*'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify Windows native picker and installer contract
        run: node scripts/verify-windows-native-picker.mjs

      - name: Build Windows Setup.exe with bundled FFmpeg
        run: npm run package:win

      - name: Verify bundled FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD 'release\win-unpacked\resources\ffmpeg\ffmpeg.exe'
          $ffprobe = Join-Path $PWD 'release\win-unpacked\resources\ffmpeg\ffprobe.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Bundled ffmpeg.exe missing: $ffmpeg" }
          if (-not (Test-Path $ffprobe)) { throw "Bundled ffprobe.exe missing: $ffprobe" }
          & $ffmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg.exe failed to start' }
          $encoders = (& $ffmpeg -hide_banner -encoders 2>&1 | Out-String)
          if ($encoders -notmatch 'libx264') { throw 'Bundled FFmpeg is missing libx264 CPU H.264 encoder' }
          if ($encoders -notmatch 'aac') { throw 'Bundled FFmpeg is missing AAC audio encoder' }
          Write-Host 'Bundled FFmpeg/ffprobe and core export encoders verified.'

      - name: Inventory bundled Windows GPU capabilities
        continue-on-error: true
        env:
          VIDEO_EDITOR_FFMPEG: ${{ github.workspace }}\release\win-unpacked\resources\ffmpeg\ffmpeg.exe
        run: node scripts/verify-gpu-runtime.mjs

      - name: Verify basic editing with network blocked
        run: npx electron scripts/verify-offline-editing.cjs

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'VideoEditor-Setup-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows Setup.exe was not produced' }
          if ($installer.Length -lt 50MB) { throw "Installer is unexpectedly small for bundled media runtime: $($installer.Length) bytes" }
          Write-Host "Verified installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Silent install and shortcut smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter 'VideoEditor-Setup-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact is missing before smoke test' }

          Write-Host "Installing $($installer.FullName) silently on fresh Windows runner"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)" }

          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Video Editor.lnk'
          $startMenuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Video Editor.lnk'
          if (-not (Test-Path $desktopShortcut)) { throw "Desktop shortcut was not created: $desktopShortcut" }
          if (-not (Test-Path $startMenuShortcut)) { throw "Start Menu shortcut was not created: $startMenuShortcut" }

          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($startMenuShortcut)
          $appExe = $shortcut.TargetPath
          if (-not $appExe -or -not (Test-Path $appExe)) { throw "Installed application target is missing: $appExe" }
          Write-Host "Installed application target: $appExe"

          $installedFfmpeg = Join-Path (Split-Path $appExe -Parent) 'resources\ffmpeg\ffmpeg.exe'
          if (-not (Test-Path $installedFfmpeg)) { throw "Installed bundled FFmpeg is missing: $installedFfmpeg" }
          & $installedFfmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Installed bundled FFmpeg failed to start' }

          $app = Start-Process -FilePath $appExe -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Installed desktop app exited during startup smoke test with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host 'Installed app stayed alive through startup smoke test'

          $installDir = Split-Path $appExe -Parent
          $uninstaller = Get-ChildItem -Path $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1
          if ($uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited with code $($uninstall.ExitCode)" }
          }

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Windows-Setup
          path: release/VideoEditor-Setup-*.exe
          if-no-files-found: error
