name: Export Runtime

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/verify-export-runtime.cjs'
      - '.github/workflows/export-runtime.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  export-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue)
          if (-not $ffmpeg) {
            $candidate = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $candidate) { throw 'FFmpeg install completed but ffmpeg.exe was not found' }
            $candidate.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & $candidate.FullName -hide_banner -version
            & $candidate.FullName -hide_banner -encoders | Select-String 'libx264|libmp3lame|aac'
          } else {
            ffmpeg -hide_banner -version
            ffmpeg -hide_banner -encoders | Select-String 'libx264|libmp3lame|aac'
          }

      - name: Run real export runtime smoke test
        run: node scripts/verify-export-runtime.cjs
