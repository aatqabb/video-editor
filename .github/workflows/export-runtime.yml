name: Export Runtime

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/verify-export-runtime.cjs'
      - '.github/workflows/export-runtime.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  export-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify FFmpeg availability
        shell: pwsh
        run: |
          ffmpeg -hide_banner -version
          ffmpeg -hide_banner -encoders | Select-String 'libx264|libmp3lame|aac'

      - name: Run real export runtime smoke test
        run: node scripts/verify-export-runtime.cjs
